services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      BIND_ADDR: 0.0.0.0:3000
      DEFAULT_PROVIDER: ${DEFAULT_PROVIDER:-ollama}
      OLLAMA_BASE_URL: http://ollama:11434/v1
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:4b}
      CLOUD_BASE_URL: ${CLOUD_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai}
      CLOUD_MODEL: ${CLOUD_MODEL:-gemini-2.5-flash}
      CLOUD_API_KEY: ${CLOUD_API_KEY:-}
      RUST_LOG: ${RUST_LOG:-hearme=info}
    depends_on:
      ollama:
        condition: service_healthy

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 30

  model-setup:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      MODEL: ${OLLAMA_MODEL:-qwen3:4b}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama pull "$$MODEL"

volumes:
  ollama-data:
